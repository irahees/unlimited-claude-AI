<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="A mobile-installable Claude-style AI chat interface powered by Puter.js.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <title>Claude AI Chat</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171717;color:#f5f5f5;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);text-align:center}h1{font-size:26px;margin:18px 0 8px}p{color:#b8b8b8;line-height:1.55}
    .mark{width:76px;height:76px;border-radius:22px;background:#d97757;display:grid;place-items:center;margin:auto;font-size:38px;font-weight:700;color:#171717}
    button{border:0;border-radius:12px;background:#d97757;color:#171717;font-weight:700;font-size:16px;padding:14px 20px;margin:12px 0;min-width:180px}
    small{display:block;color:#888;margin-top:14px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C</div>
    <h1>Claude AI Chat</h1>
    <p>Opening your chat workspace…</p>
    <button id="open" type="button">Open chat</button>
    <small>Install this app from Chrome menu → Add to Home screen.</small>
  </main>
  <script>
    const chatPath = "./unlimited%20claude/Claude.html";
    document.getElementById("open").addEventListener("click", () => location.href = chatPath);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Offline support unavailable:", err));
    }
    window.setTimeout(() => { if (location.pathname === "/") location.replace(chatPath); }, 900);
  </script>
</body>
</html>
